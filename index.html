<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>韓文造句練習</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --text:#1f2430; --sub:#6b7280; --main:#4f46e5;
  --ok:#16a34a; --bad:#dc2626;
  --n:#2563eb; --p:#ea580c; --v:#16a34a; --a:#0d9488; --t:#9333ea;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12141b; --card:#1d2130; --text:#e8eaf0; --sub:#9aa3b5;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Noto Sans KR","Noto Sans TC",sans-serif;
  padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom));}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 4px}
header h1{font-size:18px;margin:0}
.score{font-size:13px;color:var(--sub)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sentence{font-size:26px;font-weight:700;line-height:1.4;word-break:keep-all;display:flex;
  justify-content:space-between;gap:8px;align-items:flex-start}
.speak{border:none;background:var(--bg);border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.zh{margin-top:8px;font-size:17px;color:var(--main);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1px solid rgba(128,128,128,.25);border-radius:12px;padding:8px 10px;min-width:96px;flex:1 1 auto}
.chip .kohead{font-size:20px;font-weight:700;margin-bottom:4px}
.part{font-size:13px;line-height:1.5;margin-top:3px}
.part b{font-size:15px}
.tag{display:inline-block;color:#fff;border-radius:6px;padding:0 6px;margin:0 4px;font-size:11px}
.n .tag{background:var(--n)} .p .tag{background:var(--p)} .v .tag{background:var(--v)}
.a .tag{background:var(--a)} .t .tag{background:var(--t)}
.part .d{color:var(--sub)}
.legend{font-size:12px;color:var(--sub);margin-top:10px}
textarea,input[type=text]{width:100%;font-size:20px;padding:14px;border-radius:12px;
  border:2px solid rgba(128,128,128,.35);background:var(--card);color:var(--text);outline:none}
input[type=text].ok{border-color:var(--ok)}
input[type=text].bad{border-color:var(--bad)}
.status{min-height:22px;margin:8px 2px;font-size:14px}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
button.next{width:100%;padding:16px;font-size:18px;border:none;border-radius:12px;
  background:var(--main);color:#fff;font-weight:700}
button.next:disabled{opacity:.35}
.opts{display:flex;gap:16px;font-size:14px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px}
.dictation .k{filter:blur(7px);transition:.2s}
.dictation .k.show{filter:none}
.hide-ann .chips{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🇰🇷 韓文造句練習</h1>
    <div class="score" id="score"></div>
  </header>

  <div class="card">
    <div class="sentence">
      <span class="k" id="ko"></span>
      <button class="speak" id="speak" aria-label="發音">🔊</button>
    </div>
    <div class="zh" id="zh"></div>
  </div>

  <div class="card">
    <div class="chips" id="chips"></div>
    <div class="legend">
      <span class="tag" style="background:var(--n)">名詞</span>
      <span class="tag" style="background:var(--p)">助詞</span>
      <span class="tag" style="background:var(--v)">動詞</span>
      <span class="tag" style="background:var(--a)">形容詞</span>
      <span class="tag" style="background:var(--t)">副詞</span>
    </div>
  </div>

  <div class="card">
    <input type="text" id="answer" lang="ko" inputmode="text" enterkeyhint="done"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="請用手機輸入上面的韓文句子">
    <div class="status" id="status"></div>
    <button class="next" id="next" disabled>下一題 →</button>
    <div class="opts">
      <label><input type="checkbox" id="optDict"> 默寫模式(模糊韓文,點擊可顯示)</label>
      <label><input type="checkbox" id="optAnn" checked> 顯示文法標註</label>
    </div>
  </div>
</div>

<script>
/* ===================== 詞庫 ===================== */
const N = (ko, zh, tag='名詞') => ({ko, zh, tag});

const SUBJ = [
  N('저','我','代名詞'), N('친구','朋友'), N('동생','弟弟/妹妹'),
  N('어머니','媽媽'), N('아버지','爸爸'), N('선생님','老師'), N('학생','學生')
];
const PLACES = [
  N('학교','學校'), N('집','家'), N('회사','公司'), N('도서관','圖書館'),
  N('카페','咖啡廳'), N('식당','餐廳'), N('공원','公園'), N('시장','市場'), N('은행','銀行')
];
const FOOD  = [N('사과','蘋果'),N('빵','麵包'),N('김치','泡菜'),N('밥','飯'),N('라면','泡麵'),N('불고기','烤肉'),N('비빔밥','拌飯')];
const DRINK = [N('물','水'),N('커피','咖啡'),N('우유','牛奶'),N('주스','果汁'),N('차','茶')];
const READ  = [N('책','書'),N('신문','報紙'),N('잡지','雜誌')];
const WATCH = [N('영화','電影'),N('드라마','連續劇')];
const MUSIC = [N('음악','音樂'),N('노래','歌')];
const BUY   = [N('사과','蘋果'),N('빵','麵包'),N('책','書'),N('우유','牛奶'),N('가방','包包'),N('옷','衣服'),N('신발','鞋子')];
const PEOPLE= [N('친구','朋友'),N('선생님','老師'),N('어머니','媽媽'),N('아버지','爸爸'),N('동생','弟弟/妹妹')];
const JOBS  = [N('학생','學生'),N('선생님','老師'),N('회사원','上班族'),N('의사','醫生'),N('친구','朋友')];

/* 及物動詞 */
const TRANS = [
  {base:'먹다', zh:'吃',  present:'먹어요', past:'먹었어요', future:'먹을 거예요', objs:FOOD},
  {base:'마시다',zh:'喝',  present:'마셔요', past:'마셨어요', future:'마실 거예요', objs:DRINK},
  {base:'읽다', zh:'讀',  present:'읽어요', past:'읽었어요', future:'읽을 거예요', objs:READ},
  {base:'보다', zh:'看',  present:'봐요',   past:'봤어요',   future:'볼 거예요',   objs:WATCH},
  {base:'듣다', zh:'聽',  present:'들어요', past:'들었어요', future:'들을 거예요', objs:MUSIC},
  {base:'사다', zh:'買',  present:'사요',   past:'샀어요',   future:'살 거예요',   objs:BUY},
  {base:'만나다',zh:'見',  present:'만나요', past:'만났어요', future:'만날 거예요', objs:PEOPLE, person:true},
];
/* 不及物動詞 */
const INTR = [
  {base:'공부하다',zh:'念書', present:'공부해요', past:'공부했어요', future:'공부할 거예요'},
  {base:'운동하다',zh:'運動', present:'운동해요', past:'운동했어요', future:'운동할 거예요'},
];
/* 移動動詞 */
const MOVE = [
  {base:'가다', zh:'去', present:'가요', past:'갔어요', future:'갈 거예요'},
  {base:'오다', zh:'來', present:'와요', past:'왔어요', future:'올 거예요'},
];
/* 形容詞 */
const ADJ = [
  {base:'맛있다',  zh:'好吃', ko:'맛있어요',  nouns:FOOD},
  {base:'재미있다',zh:'有趣', ko:'재미있어요',nouns:[...WATCH,N('책','書')]},
  {base:'크다',    zh:'大',   ko:'커요',      nouns:PLACES},
  {base:'작다',    zh:'小',   ko:'작아요',    nouns:PLACES},
  {base:'멀다',    zh:'遠',   ko:'멀어요',    nouns:PLACES},
  {base:'예쁘다',  zh:'漂亮', ko:'예뻐요',    nouns:[N('공원','公園'),N('옷','衣服'),N('가방','包包'),N('집','家')]},
  {base:'뜨겁다',  zh:'燙',   ko:'뜨거워요',  nouns:[N('커피','咖啡'),N('차','茶'),N('라면','泡麵')]},
  {base:'차갑다',  zh:'冰',   ko:'차가워요',  nouns:[N('물','水'),N('주스','果汁'),N('우유','牛奶')]},
  {base:'비싸다',  zh:'貴',   ko:'비싸요',    nouns:[N('가방','包包'),N('옷','衣服'),N('신발','鞋子'),N('책','書')]},
];
const ADV = [
  {ko:'정말', zh:'真的'}, {ko:'아주', zh:'非常'}, {ko:'조금', zh:'有點'}
];
const TIME = {
  present:[null,{ko:'오늘',zh:'今天'}],
  past:[{ko:'어제',zh:'昨天'}],
  future:[{ko:'내일',zh:'明天'}],
};

/* ===================== 文法資料 ===================== */
const hasBatchim = w => {
  const c = w.charCodeAt(w.length-1) - 0xAC00;
  return c >= 0 && c <= 11171 && c % 28 !== 0;
};
const PART = {
  topic:{pick:w=>hasBatchim(w)?'은':'는', tag:'主題助詞', zh:'「…這個人/事物(則)」;有收音用 은,無收音用 는'},
  subj: {pick:w=>hasBatchim(w)?'이':'가', tag:'主格助詞', zh:'標示主語;有收音用 이,無收音用 가'},
  obj:  {pick:w=>hasBatchim(w)?'을':'를', tag:'受格助詞', zh:'標示受詞「把…」;有收音用 을,無收音用 를'},
  to:   {pick:()=>'에',     tag:'方向助詞', zh:'「到…、往…」(移動的目的地)'},
  at:   {pick:()=>'에서',   tag:'地點助詞', zh:'「在…」(動作發生的地點)'},
};
const TENSE = {
  present:{t:'-아/어요',        tag:'現在式', zh:'現在/習慣,日常禮貌語尾'},
  past:   {t:'-았/었어요',      tag:'過去式', zh:'「…了」,已發生'},
  future: {t:'-(으)ㄹ 거예요',   tag:'未來式', zh:'「將會…/打算…」'},
};

/* ===================== 工具 ===================== */
const pick = a => a[Math.floor(Math.random()*a.length)];
const part = (t, tag, zh, c) => ({t, tag, zh, c});

function nounChip(n, ptype){
  const parts = [part(n.ko, n.tag, n.zh, 'n')];
  let ko = n.ko;
  if(ptype){
    const info = PART[ptype], p = info.pick(n.ko);
    ko += p;
    parts.push(part(p, info.tag, info.zh, 'p'));
  }
  return {ko, parts};
}
function timeChip(t){ return {ko:t.ko, parts:[part(t.ko,'時間副詞',t.zh,'t')]}; }
function verbChip(v, tense){
  const T = TENSE[tense];
  return {ko:v[tense], parts:[
    part(v.base,'動詞原形',v.zh,'v'),
    part(T.t, T.tag, T.zh, 'v')
  ]};
}
const zhVerb = (v, tense, tail='') =>
  (tense==='future'?'會':'') + v.zh + (tense==='past'?'了':'') + tail;

/* ===================== 句子生成 ===================== */
function gen(){
  const type = pick(['trans','trans','trans','move','intr','adj','adj','copula']);
  const tense = pick(['present','past','future']);
  const time = pick(TIME[tense]);
  const tChip = time ? [timeChip(time)] : [];
  const tZh = time ? time.zh : '';

  if(type==='trans'){
    const v = pick(TRANS);
    const obj = pick(v.objs);
    const subj = pick(SUBJ.filter(s => s.ko !== obj.ko));
    const withPlace = Math.random() < 0.7;
    const place = pick(PLACES);
    const e = [nounChip(subj,'topic'), ...tChip];
    if(withPlace) e.push(nounChip(place,'at'));
    e.push(nounChip(obj,'obj'), verbChip(v,tense));
    return {e, zh: subj.zh + tZh + (withPlace?'在'+place.zh:'') + zhVerb(v,tense,obj.zh) + '。'};
  }
  if(type==='move'){
    const v = pick(MOVE), place = pick(PLACES), subj = pick(SUBJ);
    const e = [nounChip(subj,'topic'), ...tChip, nounChip(place,'to'), verbChip(v,tense)];
    return {e, zh: subj.zh + tZh + zhVerb(v,tense,place.zh) + '。'};
  }
  if(type==='intr'){
    const v = pick(INTR), place = pick(PLACES), subj = pick(SUBJ);
    const e = [nounChip(subj,'topic'), ...tChip, nounChip(place,'at'), verbChip(v,tense)];
    return {e, zh: subj.zh + tZh + '在' + place.zh + zhVerb(v,tense) + '。'};
  }
  if(type==='adj'){
    const a = pick(ADJ), n = pick(a.nouns), adv = pick(ADV);
    const e = [
      nounChip(n,'subj'),
      {ko:adv.ko, parts:[part(adv.ko,'程度副詞',adv.zh,'t')]},
      {ko:a.ko, parts:[
        part(a.base,'形容詞原形',a.zh,'a'),
        part(TENSE.present.t,'現在式','形容詞+아/어요 = 禮貌的狀態描述','a')
      ]}
    ];
    return {e, zh: n.zh + adv.zh + a.zh + '。'};
  }
  // copula
  const job = pick(JOBS);
  const subj = pick(SUBJ.filter(s => s.ko !== job.ko));
  const cop = hasBatchim(job.ko) ? '이에요' : '예요';
  const e = [
    nounChip(subj,'topic'),
    {ko: job.ko+cop, parts:[
      part(job.ko, '名詞', job.zh, 'n'),
      part(cop, '敘述格助詞', '「是」;有收音用 이에요,無收音用 예요', 'p')
    ]}
  ];
  return {e, zh: subj.zh + '是' + job.zh + '。'};
}

/* ===================== 畫面 ===================== */
const $ = id => document.getElementById(id);
let cur = null, solved = false;
let stat = JSON.parse(localStorage.getItem('koStat') || '{"streak":0,"total":0}');

const norm = s => s.normalize('NFC').replace(/[\s.,!?。,!?]/g,'');

function renderScore(){ $('score').textContent = `🔥連續 ${stat.streak}|累計 ${stat.total}`; }

function newQ(){
  cur = gen(); solved = false;
  cur.ko = cur.e.map(x=>x.ko).join(' ') + '.';
  $('ko').textContent = cur.ko;
  $('zh').textContent = cur.zh;
  $('chips').innerHTML = cur.e.map(c => `
    <div class="chip">
      <div class="kohead k">${c.ko}</div>
      ${c.parts.map(p => `
        <div class="part ${p.c}">
          <b class="k">${p.t}</b><span class="tag">${p.tag}</span><span class="d">${p.zh}</span>
        </div>`).join('')}
    </div>`).join('');
  document.querySelectorAll('.k').forEach(el =>
    el.addEventListener('click', () => el.classList.toggle('show')));
  const a = $('answer');
  a.value = ''; a.className = ''; a.disabled = false;
  $('status').textContent = ''; $('status').className = 'status';
  $('next').disabled = true;
  renderScore();
  setTimeout(()=>a.focus(), 50);
}

function check(){
  if(solved) return;
  const v = norm($('answer').value), t = norm(cur.ko);
  const a = $('answer'), s = $('status');
  if(v === t){
    solved = true;
    a.className = 'ok'; a.disabled = true;
    s.textContent = '✅ 正確!'; s.className = 'status ok';
    $('next').disabled = false;
    stat.streak++; stat.total++;
    localStorage.setItem('koStat', JSON.stringify(stat));
    renderScore();
    $('next').focus();
  } else if(v.length >= t.length){
    a.className = 'bad';
    s.textContent = '❌ 還不太對,再檢查助詞與語尾'; s.className = 'status bad';
  } else {
    a.className = ''; s.textContent = ''; s.className = 'status';
  }
}

$('answer').addEventListener('input', e => { if(!e.isComposing) check(); });
$('answer').addEventListener('compositionend', check);
$('answer').addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); solved ? newQ() : check(); }
});
$('next').addEventListener('click', () => { if(solved) newQ(); });
$('speak').addEventListener('click', () => {
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cur.ko);
  u.lang = 'ko-KR'; u.rate = 0.9;
  speechSynthesis.speak(u);
});
$('optDict').addEventListener('change', e => document.body.classList.toggle('dictation', e.target.checked));
$('optAnn').addEventListener('change', e => document.body.classList.toggle('hide-ann', !e.target.checked));

// 答錯時,連續紀錄歸零
$('answer').addEventListener('blur', ()=>{});
newQ();
</script>
</body>
</html>
